version: '3.8'

services:
  vectorqa-app:
    build: .
    ports:
      - "7860:7860"
    volumes:
      # App source — live reload during development
      - ./app:/app/app
      - ./.streamlit:/app/.streamlit
      # Hadith data (pre-built vector DB + JSON sources)
      - ./data/hadith_vectors:/app/data/hadith_vectors
      - ./data/vectors:/app/data/vectors
      - ./data/uploaded_docs:/app/data/uploaded_docs
      - ./data/query_cache:/app/data/query_cache
      - ./data/feedback:/app/data/feedback
      # All hadith JSON files
      - ./data/hadiths.json:/app/data/hadiths.json
      - ./data/muslim_hadiths.json:/app/data/muslim_hadiths.json
      - ./data/tirmidhi_hadiths.json:/app/data/tirmidhi_hadiths.json
      - ./data/abu_dawud_hadiths.json:/app/data/abu_dawud_hadiths.json
      - ./data/ibnmajah_hadiths.json:/app/data/ibnmajah_hadiths.json
      - ./data/nasai_hadiths.json:/app/data/nasai_hadiths.json
      - ./data/nawawi_hadiths.json:/app/data/nawawi_hadiths.json
      # Fine-tuned embedding model
      - ./models:/app/models
      # GCP service-account key (read-only)
      - ./gemini_auth.json:/secrets/gcp-key.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION:-us-central1}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
