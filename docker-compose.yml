version: '3.8'

services:
  vectorqa-app:
    build: .
    ports:
      - "8501:7860"
    volumes:
      # Persist vector DB and uploaded docs between container restarts.
      - ./data/hadith_vectors:/app/data/hadith_vectors
      - ./data/vectors:/app/data/vectors
      - ./data/uploaded_docs:/app/data/uploaded_docs
      # Mount app source for live-reload during development.
      # Remove this for a pure production deployment.
      - ./app:/app/app
      - ./.streamlit:/app/.streamlit
      # Mount the GCP service-account key read-only.
      # The host path should point to the actual key file (never committed).
      # Matches GOOGLE_APPLICATION_CREDENTIALS inside the container.
      - ./gemini_auth.json:/secrets/gcp-key.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Vertex AI auth — path is the container-side mount point above.
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
      # Set your GCP project ID here (or load from .env via env_file below).
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION:-us-central1}
    # Optionally load additional variables (e.g. GCP_PROJECT_ID) from a .env
    # file that is NOT committed to git.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
