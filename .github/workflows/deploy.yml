name: Build → Push → Deploy

# Triggers on every push to main
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nahinfarhan/hadith-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1.5. Set up Python and Download Data ────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Hugging Face Data
        run: |
          pip install huggingface_hub
          python << 'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="nahinfarhan/hadith-vectors-db", repo_type="dataset", local_dir="./data")
          snapshot_download(repo_id="nahinfarhan/hadith-retriever-bn-v2", local_dir="./models/hadith-retriever-bn-v2")
          EOF

      # ── 2. Log in to GitHub Container Registry ──────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Set up Docker Buildx (for linux/amd64 cross-build) ───────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build and push image ─────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Re-use cached layers from previous builds to speed things up
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ── 5. SSH into VPS and redeploy ────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            # ── Sync all hadith JSON files from HuggingFace ─────────────────
            # --break-system-packages required on Ubuntu 22+ (PEP 668)
            pip install -q huggingface_hub hf_transfer --break-system-packages

            HUGGINGFACE_HUB_ENABLE_HF_TRANSFER=1 python3 -c "
            from huggingface_hub import snapshot_download
            import shutil, os

            local = snapshot_download(
                repo_id='nahinfarhan/hadith-vectors-db',
                repo_type='dataset',
                local_dir='/tmp/hf_data',
                ignore_patterns=['*.arrow','*.parquet'],
            )

            data_dir = '/opt/hadith-app/data'
            for f in os.listdir(local):
                if f.endswith('.json'):
                    src = os.path.join(local, f)
                    dst = os.path.join(data_dir, f)
                    shutil.copy2(src, dst)
                    print(f'✅ {f}')
            "

            # ── Sync the fine-tuned embedding model (skipped if already present) ──
            mkdir -p /opt/hadith-app/models
            HUGGINGFACE_HUB_ENABLE_HF_TRANSFER=1 python3 -c "
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id='nahinfarhan/hadith-retriever-bn-v2',
                local_dir='/opt/hadith-app/models/hadith-retriever-bn-v2',
            )
            print('✅ embedding model ready')
            "

            # Log in to GHCR on the VPS and pull the new image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/nahinfarhan/hadith-app:latest

            # Stop and remove the old container
            docker stop hadith-app || true
            docker rm   hadith-app || true

            # Start fresh with the new image
            docker run -d \
              --name hadith-app \
              -p 7860:7860 \
              --restart unless-stopped \
              --env-file /opt/hadith-app/.env \
              -v /opt/hadith-app/secrets/gcp-key.json:/secrets/gcp-key.json:ro \
              -v /opt/hadith-app/models:/app/models:ro \
              -v /opt/hadith-app/data:/app/data \
              ghcr.io/nahinfarhan/hadith-app:latest

            # Health check — wait for app to be ready
            sleep 10
            curl -sf http://localhost:7860/_stcore/health && echo " — app is up"

            # Build the vector DB ONLY if the live one is missing or incomplete.
            # It is built into a staging dir by a separate one-off container, then
            # swapped in and the app restarted, so the live DB is never wiped or
            # served half-built. Log: /opt/hadith-app/data/db_rebuild.log
            if [ ! -f /opt/hadith-app/data/hadith_vectors/.build_complete ] \
               && [ -z "$(docker ps -q -f name=hadith-build)" ]; then
              cat > /opt/hadith-app/rebuild_db.sh <<'EOS'
            #!/bin/sh
            set -e
            D=/opt/hadith-app/data
            rm -rf "$D/hadith_vectors_new" "$D/hadith_vectors_old"
            docker run --rm --name hadith-build \
              -v /opt/hadith-app/models:/app/models:ro \
              -v "$D":/app/data \
              ghcr.io/nahinfarhan/hadith-app:latest \
              python3 app/build_hadith_db.py --out /app/data/hadith_vectors_new
            if [ -d "$D/hadith_vectors" ]; then mv "$D/hadith_vectors" "$D/hadith_vectors_old"; fi
            mv "$D/hadith_vectors_new" "$D/hadith_vectors"
            docker restart hadith-app
            rm -rf "$D/hadith_vectors_old"
            EOS
              nohup sh /opt/hadith-app/rebuild_db.sh > /opt/hadith-app/data/db_rebuild.log 2>&1 &
              echo "⏳ DB build started in background — tail /opt/hadith-app/data/db_rebuild.log"
            else
              echo "✅ Vector DB already built (or a build is running) — not rebuilding"
            fi

            # Remove dangling images to free disk space
            docker image prune -f
