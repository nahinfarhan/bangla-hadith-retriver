name: Build → Push → Deploy

# Triggers on every push to main
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nahinfarhan/hadith-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Log in to GitHub Container Registry ──────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Set up Docker Buildx (for linux/amd64 cross-build) ───────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build and push image ─────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Re-use cached layers from previous builds to speed things up
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ── 5. SSH into VPS and redeploy ────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull the new image
            docker pull ghcr.io/nahinfarhan/hadith-app:latest

            # Stop and remove the old container
            docker stop hadith-app || true
            docker rm   hadith-app || true

            # Start fresh with the new image
            docker run -d \
              --name hadith-app \
              -p 7860:7860 \
              --restart unless-stopped \
              --env-file /opt/hadith-app/.env \
              -v /opt/hadith-app/secrets/gcp-key.json:/secrets/gcp-key.json:ro \
              ghcr.io/nahinfarhan/hadith-app:latest

            # Quick health check
            sleep 10
            curl -sf http://localhost:7860/_stcore/health && echo " — deploy OK"

            # Remove dangling images to free disk space
            docker image prune -f
