[theme]
# Neutral base — CSS token overrides own all colours.
# Do NOT add primaryColor / backgroundColor / textColor here;
# the injected CSS handles both light and dark themes dynamically.
base = "light"

[server]
headless               = true
port                   = 7860
enableCORS             = false
enableXsrfProtection   = false

[browser]
gatherUsageStats       = false
